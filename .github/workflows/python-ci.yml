name: Python CI

on:
  push:
  pull_request:

jobs:
  pure-python-tests:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m pip install --upgrade pip pytest numpy pyyaml
      - run: python -m compileall ros2/cooperative_parking_robot
      - name: Run ROS-independent unit and source-policy regressions
        env:
          PYTHONPATH: ros2/cooperative_parking_robot
        run: |
          python -m pytest -q \
            ros2/cooperative_parking_robot/test/test_relative_sync_filter.py \
            ros2/cooperative_parking_robot/test/test_rigid_body_p0_policy.py \
            ros2/cooperative_parking_robot/test/test_dual_cctv_merge.py \
            ros2/cooperative_parking_robot/test/test_v9_scanin_complete.py \
            ros2/cooperative_parking_robot/test/test_encoder_relative_predictor.py \
            ros2/cooperative_parking_robot/test/test_fault_policy.py \
            ros2/cooperative_parking_robot/test/test_runtime_safety_regressions.py
