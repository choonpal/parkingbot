# 예시 주차장 배치. 현장에서는 bev_layout_calibrator가 생성한 YAML로 교체한다.
# 모든 좌표/크기는 map frame의 metre, Yaw는 통로에서 슬롯 안쪽 방향의 degree다.
# single/dual CCTV의 node name과 무관하게 perception 공용 값을 적용한다.
/**:
  ros__parameters:
    # 이 파일은 시연용 예시이므로 실차 mission launch에서는 거부된다.
    layout_registered: false
    map_resolution: 0.05
    map_width_m: 6.0
    map_height_m: 4.0
    # 차량 장애물 fallback 정사각형 한 변. Seg mask가 있으면 점유는 mask로 계산한다.
    car_size_m: 0.90
    # 차량 대기영역 네 모서리 + 기존 축정렬 코드와의 호환 bounding box.
    waiting_polygon: [2.10, 0.30, 2.50, 0.30, 2.50, 0.90, 2.10, 0.90]
    waiting_zone: [2.10, 0.30, 2.50, 0.90]
    # 같은 index의 ID / 중심(x,y) / 길이·폭 / 통로->안쪽 Yaw가 한 슬롯이다.
    slot_ids: ["P1", "P2", "P3", "P4"]
    slot_coords: [1.5, 3.0, 2.5, 3.0, 3.5, 3.0, 4.5, 3.0]
    slot_sizes: [1.80, 0.70, 1.80, 0.70, 1.80, 0.70, 1.80, 0.70]
    slot_yaws_deg: [90.0, 90.0, 90.0, 90.0]
    slot_polygons: [1.85, 2.10, 1.85, 3.90, 1.15, 3.90, 1.15, 2.10,
                    2.85, 2.10, 2.85, 3.90, 2.15, 3.90, 2.15, 2.10,
                    3.85, 2.10, 3.85, 3.90, 3.15, 3.90, 3.15, 2.10,
                    4.85, 2.10, 4.85, 3.90, 4.15, 3.90, 4.15, 2.10]
    use_fixed_slots: true
    # 차량 mask가 슬롯 면적의 10% 이상을 차지하면 점유로 판정한다.
    slot_occupancy_overlap_ratio: 0.10
    slot_empty_confirm_frames: 5
    slot_occupied_hold_s: 0.75
    vehicle_feedback_association_gate_m: 0.45
    use_mask_vehicle_dimensions: true

fleet_manager_node:
  ros__parameters:
    layout_registered: false
    waiting_x: 2.3
    waiting_y: 0.6
    waiting_yaw_deg: 0.0
    # 차량 중심 detection ROI. 물리적인 loaded-footprint 경계가 아니다.
    waiting_polygon: [2.10, 0.30, 2.50, 0.30, 2.50, 0.90, 2.10, 0.90]
    map_resolution: 0.05
    slot_ids: ["P1", "P2", "P3", "P4"]
    slot_coords: [1.5, 3.0, 2.5, 3.0, 3.5, 3.0, 4.5, 3.0]
    slot_sizes: [1.80, 0.70, 1.80, 0.70, 1.80, 0.70, 1.80, 0.70]
    slot_yaws_deg: [90.0, 90.0, 90.0, 90.0]
    # 로봇 1대 실측 외곽. +x=차량 앞뒤, +y=차량 좌우.
    robot_length_m: 0.565
    robot_width_m: 0.275
    minimum_inter_robot_gap_m: 0.10
    # 모형차 placeholder. YOLO vehicle_spec의 mask 치수가 들어오면 임무 전에 갱신된다.
    default_wheelbase_m: 0.70
    default_vehicle_length_m: 0.90
    default_vehicle_width_m: 0.35
    # Perception의 polygon 없는 차량 0.90m 정사각형 raster와 동일한 source mask.
    source_vehicle_fallback_mask_m: 0.90
    footprint_safety_margin_m: 0.06
    # 슬롯 적합성은 Front+차량+Rear 결합 footprint에 아래 양측 여유를 더해 검사한다.
    slot_fit_longitudinal_margin_m: 0.06
    slot_fit_lateral_margin_m: 0.06
    slot_staging_gap_m: 0.10
    initial_target_offset_gate_m: 0.50
    use_staged_slot_entry: true
    # 이번 demo의 retrieve 후방 접근 재사용 조건.
    parking_direction: "forward"
    # 실증 P1~P4는 동시 접근 간격을 만족하지 않아 기존 Front-first를 사용한다.
    simultaneous_entry: false
    unknown_is_occupied: true
    odom_timeout_s: 0.5
    # IndividualMoveNode의 접근 yaw controller 기본값과 preflight를 일치시킨다.
    approach_yaw_gain: 1.5
    approach_max_yaw_rate_rps: 0.15
