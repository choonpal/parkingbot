# 40 cm 타일 기준으로 현장 등록한 parkingbot 런타임 배치.
# 모든 좌표/크기는 Homography와 같은 map frame의 metre 단위다.
#
# 차량 WAITING ZONE: (0.0,0.0) ~ (1.2,0.8), 중심 (0.6,0.4)
# 주차로봇 출발영역: (3.2,0.0) ~ (4.0,0.8)
#   Front 시작 중심: (3.6,0.6)
#   Rear  시작 중심: (3.6,0.2)
# 차량과 로봇의 앞머리는 WAITING ZONE 방향(-X, yaw=180 deg)을 향한다.
#
# 같은 index의 ID / 중심(x,y) / 길이·폭 / 통로->안쪽 Yaw가 한 슬롯이다.
/**:
  ros__parameters:
    layout_registered: true
    map_resolution: 0.050000
    map_width_m: 6.000000
    map_height_m: 4.000000
    car_size_m: 0.900000

    # 차량 중심 detection ROI. 꼭짓점은 자기교차가 없도록 CCW로 정렬했다.
    waiting_polygon: [0.000000, 0.000000, 1.200000, 0.000000, 1.200000, 0.800000, 0.000000, 0.800000]
    waiting_zone: [0.000000, 0.000000, 1.200000, 0.800000]

    # 두 로봇은 나란히 서서 -X(대기공간) 방향을 바라본다.
    robot_start_polygon: [3.200000, 0.000000, 4.000000, 0.000000, 4.000000, 0.800000, 3.200000, 0.800000]
    front_start_pose: [3.600000, 0.600000, 180.000000]
    rear_start_pose: [3.600000, 0.200000, 180.000000]

    # P1 -> P4는 +X 방향 순서다. 긴 축은 +Y이고 입구는 y=1.6 쪽이다.
    slot_ids: ["P1", "P2", "P3", "P4"]
    slot_coords: [1.200000, 2.200000, 2.000000, 2.200000, 2.800000, 2.200000, 3.600000, 2.200000]
    slot_sizes: [1.200000, 0.800000, 1.200000, 0.800000, 1.200000, 0.800000, 1.200000, 0.800000]
    slot_yaws_deg: [90.000000, 90.000000, 90.000000, 90.000000]
    slot_polygons: [0.800000, 1.600000, 1.600000, 1.600000, 1.600000, 2.800000, 0.800000, 2.800000,
                    1.600000, 1.600000, 2.400000, 1.600000, 2.400000, 2.800000, 1.600000, 2.800000,
                    2.400000, 1.600000, 3.200000, 1.600000, 3.200000, 2.800000, 2.400000, 2.800000,
                    3.200000, 1.600000, 4.000000, 1.600000, 4.000000, 2.800000, 3.200000, 2.800000]
    use_fixed_slots: true
    slot_occupancy_overlap_ratio: 0.100000
    slot_empty_confirm_frames: 5
    slot_occupied_hold_s: 0.750000
    vehicle_feedback_association_gate_m: 0.450000
    use_mask_vehicle_dimensions: true

fleet_manager_node:
  ros__parameters:
    layout_registered: true
    map_resolution: 0.050000
    waiting_x: 0.600000
    waiting_y: 0.400000
    waiting_yaw_deg: 180.000000
    waiting_polygon: [0.000000, 0.000000, 1.200000, 0.000000, 1.200000, 0.800000, 0.000000, 0.800000]
    source_vehicle_fallback_mask_m: 0.900000
    slot_ids: ["P1", "P2", "P3", "P4"]
    slot_coords: [1.200000, 2.200000, 2.000000, 2.200000, 2.800000, 2.200000, 3.600000, 2.200000]
    slot_sizes: [1.200000, 0.800000, 1.200000, 0.800000, 1.200000, 0.800000, 1.200000, 0.800000]
    slot_yaws_deg: [90.000000, 90.000000, 90.000000, 90.000000]

    robot_length_m: 0.565000
    robot_width_m: 0.275000
    minimum_inter_robot_gap_m: 0.100000
    default_wheelbase_m: 0.700000
    default_vehicle_length_m: 0.900000
    default_vehicle_width_m: 0.350000
    footprint_safety_margin_m: 0.060000
    slot_fit_longitudinal_margin_m: 0.060000
    slot_fit_lateral_margin_m: 0.060000
    slot_staging_gap_m: 0.100000
    initial_target_offset_gate_m: 0.500000
    use_staged_slot_entry: true
    parking_direction: "forward"
    simultaneous_entry: false
    unknown_is_occupied: true
    odom_timeout_s: 0.500000
    approach_yaw_gain: 1.500000
    approach_max_yaw_rate_rps: 0.150000

# 듀얼 CCTV의 최종 슬롯 점유 판정 노드. `/**`와 같은 현장 좌표를 명시한다.
cctv_merge_node:
  ros__parameters:
    layout_registered: true
    map_resolution: 0.050000
    map_width_m: 6.000000
    map_height_m: 4.000000
    car_size_m: 0.900000
    waiting_polygon: [0.000000, 0.000000, 1.200000, 0.000000, 1.200000, 0.800000, 0.000000, 0.800000]
    slot_ids: ["P1", "P2", "P3", "P4"]
    slot_coords: [1.200000, 2.200000, 2.000000, 2.200000, 2.800000, 2.200000, 3.600000, 2.200000]
    slot_sizes: [1.200000, 0.800000, 1.200000, 0.800000, 1.200000, 0.800000, 1.200000, 0.800000]
    slot_yaws_deg: [90.000000, 90.000000, 90.000000, 90.000000]
    slot_polygons: [0.800000, 1.600000, 1.600000, 1.600000, 1.600000, 2.800000, 0.800000, 2.800000,
                    1.600000, 1.600000, 2.400000, 1.600000, 2.400000, 2.800000, 1.600000, 2.800000,
                    2.400000, 1.600000, 3.200000, 1.600000, 3.200000, 2.800000, 2.400000, 2.800000,
                    3.200000, 1.600000, 4.000000, 1.600000, 4.000000, 2.800000, 3.200000, 2.800000]
    slot_occupancy_overlap_ratio: 0.100000
    slot_empty_confirm_frames: 5
    slot_occupied_hold_s: 0.750000
    vehicle_feedback_association_gate_m: 0.450000
