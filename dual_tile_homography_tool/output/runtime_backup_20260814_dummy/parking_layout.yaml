# BEV 브라우저 등록 도구가 생성한 주차장 배치 파일
# 모든 좌표/크기는 map frame의 metre, Yaw는 degree이다.
# 같은 index의 slot_ids/slot_coords/slot_sizes/slot_yaws_deg가 한 슬롯이다.
#
# `/**`는 노드 이름과 무관하게 적용된다. 천장 카메라 2대 구성에서
# yolo_bev_map_node_cam0 / _cam2 처럼 인스턴스 이름이 갈려도 그대로 동작한다.
/**:
  ros__parameters:
    layout_registered: true
    map_resolution: 0.050000
    map_width_m: 6.000000
    map_height_m: 4.000000
    # 대기영역의 실제 4개 모서리. 차량 중심이 이 다각형 안에 들어오면 타겟이다.
    waiting_polygon: [2.600000, 0.300000, 3.400000, 0.300000, 3.400000, 1.100000, 2.600000, 1.100000]
    # 기존 코드/수동 설정과의 호환용 축 정렬 bounding box.
    waiting_zone: [2.600000, 0.300000, 3.400000, 1.100000]
    # 고정 주차면 DB: 중심 2개, 길이/폭 2개, 통로->안쪽 방향 Yaw 1개/슬롯.
    slot_ids: ["P1", "P2", "P3", "P4"]
    slot_coords: [0.800000, 3.000000, 1.800000, 3.000000, 3.000000, 3.000000, 4.600000, 3.000000]
    slot_sizes: [1.600000, 0.700000, 1.600000, 0.700000, 1.600000, 0.700000, 1.600000, 0.700000]
    slot_yaws_deg: [90.000000, 90.000000, 90.000000, 90.000000]
    # 점유 겹침률은 fitted rectangle가 아니라 실제 클릭한 4점 polygon을 사용.
    slot_polygons: [0.450000, 2.200000, 1.150000, 2.200000, 1.150000, 3.800000, 0.450000, 3.800000, 1.450000, 2.200000, 2.150000, 2.200000, 2.150000, 3.800000, 1.450000, 3.800000, 2.650000, 2.200000, 3.350000, 2.200000, 3.350000, 3.800000, 2.650000, 3.800000, 4.250000, 2.200000, 4.950000, 2.200000, 4.950000, 3.800000, 4.250000, 3.800000]
    use_fixed_slots: true
    slot_occupancy_overlap_ratio: 0.100000
    # 일시 검출 누락으로 점유칸을 빈칸으로 바꾸지 않는 debounce.
    slot_empty_confirm_frames: 5
    slot_occupied_hold_s: 0.750000
    vehicle_feedback_association_gate_m: 0.450000
    # 차량 전용 YOLO11-Seg 마스크로 차량 크기와 점유율을 계산한다.
    use_mask_vehicle_dimensions: true

fleet_manager_node:
  ros__parameters:
    layout_registered: true
    map_resolution: 0.050000
    slot_ids: ["P1", "P2", "P3", "P4"]
    slot_coords: [0.800000, 3.000000, 1.800000, 3.000000, 3.000000, 3.000000, 4.600000, 3.000000]
    slot_sizes: [1.600000, 0.700000, 1.600000, 0.700000, 1.600000, 0.700000, 1.600000, 0.700000]
    slot_yaws_deg: [90.000000, 90.000000, 90.000000, 90.000000]
    # 최종 차량만이 아니라 Front+차량+Rear 결합 footprint가 들어가는지 검사한다.
    slot_fit_longitudinal_margin_m: 0.060000
    slot_fit_lateral_margin_m: 0.060000
    # 슬롯 입구 밖 정렬점에서 추가로 띄울 거리.
    slot_staging_gap_m: 0.100000
    # CCTV 차량 중심과 Front/Rear odom 중점 차이가 이 범위 안일 때 A* 시작점에 반영.
    initial_target_offset_gate_m: 0.500000
    use_staged_slot_entry: true
    parking_direction: "minimum_rotation"

# 천장 카메라 2대 구성의 병합 노드(cctv_merge_node)와 카메라별 sensor
# 인스턴스(yolo_bev_map_node_cam0 / _cam2)는 위 `/**` 블록에서 필요한 값을
# 모두 받는다. 인스턴스 이름이 늘어나도 이 파일은 그대로 두면 된다.
